  // ======================================================================
  // 畫面 5：法規查詢（staff／admin；只看已發佈）
  // ======================================================================
  let rsState = null;

  function renderRuleSearch() {
    rsState = { q: "", category: "", rules: [], openId: null, loading: true, message: "", seconds: null };
    drawRuleSearch();
    rsLoad();
  }

  async function rsLoad() {
    const s = rsState;
    if (s.q.length > RULE_QUERY_MAX) {
      s.message = "關鍵字最多 " + RULE_QUERY_MAX + " 個字。";
      s.loading = false;
      drawRuleSearch();
      return;
    }
    s.loading = true;
    s.message = "";
    drawRuleSearch();
    const qs = new URLSearchParams();
    if (s.q) qs.set("q", s.q);
    if (s.category) qs.set("category", s.category);
    const t0 = performance.now();
    try {
      const res = await call("GET", "/api/rules" + (qs.toString() ? "?" + qs.toString() : ""));
      if (rsState !== s) return;
      s.rules = res.rules || [];
      s.seconds = (performance.now() - t0) / 1000;
    } catch (e) {
      if (rsState !== s) return;
      s.rules = [];
      s.message = e.message;
      s.seconds = null;
    }
    s.loading = false;
    if (s.openId !== null && !s.rules.some(r => r.id === s.openId)) s.openId = null;
    drawRuleSearch();
  }

  function drawRuleSearch() {
    const s = rsState;
    const chips = '<div class="chips" role="group" aria-label="分類篩選">' +
      [""].concat(RULE_CATEGORIES).map(c =>
        '<button type="button" class="chip" data-action="rs-cat" data-cat="' + esc(c) + '" aria-pressed="' + (s.category === c ? "true" : "false") + '">' +
        esc(c || "全部") + "</button>"
      ).join("") + "</div>";

    let results;
    if (s.loading) results = '<p class="muted">搜尋中…</p>';
    else if (s.message) results = '<p class="error">' + esc(s.message) + "</p>";
    else if (!s.rules.length) results = '<p class="muted">找不到符合的條文。可以換個關鍵字，或把分類改回「全部」。</p>';
    else results =
      '<p class="muted">找到 ' + s.rules.length + " 筆" + (s.seconds !== null ? "（用時 " + s.seconds.toFixed(2) + " 秒）" : "") +
      "。按「看重點」展開條文重點與適用條件。</p>" +
      "<table><thead><tr><th>條文編號</th><th>分類</th><th>標題</th><th>規則版本</th><th>生效日期</th><th>操作</th></tr></thead><tbody>" +
      s.rules.map(r => {
        const open = s.openId === r.id;
        return "<tr><td>" + orBlank(r.article_no) + "</td><td>" + esc(r.category) + "</td><td>" + esc(r.title) + "</td>" +
          "<td>" + orBlank(r.rule_version) + "</td><td>" + orBlank(r.effective_date) + "</td>" +
          '<td><button type="button" class="btn btn-small" data-action="rs-open" data-id="' + esc(r.id) + '" aria-expanded="' + (open ? "true" : "false") + '">' +
          (open ? "收起" : "看重點") + "</button></td></tr>" +
          (open ? '<tr class="detail-row"><td colspan="6">' + ruleDetailHtml(r, false) + "</td></tr>" : "");
      }).join("") + "</tbody></table>";

    document.getElementById("main").innerHTML =
      "<h2>法規查詢</h2>" + ruleDisclaimer() + demoNotice() +
      '<div class="card"><form class="search-row" data-form="rs-search" role="search">' +
        '<label class="field-label" for="rs-q">關鍵字（比對條文編號、標題、重點說明）</label>' +
        '<div class="btn-row"><input type="search" id="rs-q" maxlength="' + RULE_QUERY_MAX + '" value="' + esc(s.q) + '" placeholder="例如 DEMO-STR、穩度、遠洋">' +
        '<button type="submit" class="btn btn-primary">搜尋</button>' +
        '<button type="button" class="btn" data-action="rs-clear">清除</button></div>' +
        '<p class="field-label" style="margin:12px 0 0">分類</p>' + chips +
      "</form></div>" +
      '<div class="card">' + results + "</div>";
  }

  function rsReadQuery() {
    const el = document.getElementById("rs-q");
    if (el && rsState) rsState.q = el.value.trim();
  }

  function onRuleSearchClick(action, btn) {
    const s = rsState;
    if (!s) return;
    if (action === "rs-cat") {
      rsReadQuery();
      const c = btn.getAttribute("data-cat") || "";
      s.category = RULE_CATEGORIES.includes(c) ? c : "";
      rsLoad();
    } else if (action === "rs-clear") {
      s.q = "";
      s.category = "";
      rsLoad();
    } else if (action === "rs-open") {
      rsReadQuery();
      const id = Number(btn.getAttribute("data-id"));
      s.openId = s.openId === id ? null : id;
      drawRuleSearch();
    }
  }

  // ======================================================================
  // 畫面 6：法規對照（staff／admin）：左邊規格參數，右邊符合與需確認的條文
  // ======================================================================
  let rmState = null;
  const MATCH_PARAM_LABELS = { loa: "船長 LOA", boat_type: "船型", area: "航區", usage: "用途", propulsion: "動力型式" };

  async function renderRuleMatch(main, pidText) {
    if (!pidText) return renderProjectPicker(main, "rule-match", "法規對照", ruleDisclaimer());
    const pid = Number(pidText);
    main.innerHTML = "<h2>法規對照</h2>" + ruleDisclaimer() + '<div class="card"><p class="muted">對照中…</p></div>';
    const seq = routeSeq;
    try {
      const res = await call("GET", "/api/projects/" + pid + "/rule-match");
      if (seq !== routeSeq) return;
      rmState = { pid, res };
      drawRuleMatch();
    } catch (e) {
      if (seq !== routeSeq) return;
      main.innerHTML = "<h2>法規對照</h2>" + ruleDisclaimer() + '<div class="card"><p class="error">' + esc(e.message) + "</p>" +
        '<p><a class="btn" href="#rule-match">選其他專案</a></p></div>';
    }
  }

  function matchListHtml(list, kind) {
    if (!list.length) return '<p class="muted">' + (kind === "match" ? "沒有符合條件的條文。" : "沒有需要確認的條文。") + "</p>";
    return '<ul class="rule-list">' + list.map(r =>
      "<li><strong>" + orBlank(r.article_no) + '</strong> <span class="badge cat">' + esc(r.category) + "</span> " + esc(r.title) +
      (r.reasons && r.reasons.length
        ? '<div class="muted">' + (kind === "match" ? "符合原因：" : "已符合的部分：") + '</div><ul class="reasons">' +
          r.reasons.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul>"
        : "") +
      (r.missing && r.missing.length
        ? '<div class="muted">需確認原因：</div><ul class="reasons missing">' + r.missing.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul>"
        : "") +
      "<details><summary>看條文重點與適用條件</summary>" + ruleDetailHtml(r, false) + "</details></li>"
    ).join("") + "</ul>";
  }

  function drawRuleMatch() {
    const s = rmState;
    const r = s.res;
    const src = r.source || {};
    let srcText;
    if (src.type === "spec") srcText = "來源：規格書 v" + esc(src.version) + "（" + esc(fmtTime(src.at)) + "）";
    else if (src.type === "draft") srcText = "來源：需求暫存（" + esc(fmtTime(src.at)) + "）。還沒有產生規格書，資料可能不完整。";
    else srcText = "這個專案還沒有需求暫存或規格書。有設定適用條件的條文都會列為「需確認」。";
    const params = r.params || {};
    const matched = r.matched || [];
    const confirm = r.needs_confirm || [];

    const left = '<section class="card"><h3>專案規格參數</h3><p>' + srcText + "</p>" +
      "<table><tbody>" + MATCH_PARAM_KEYS.map(k =>
        '<tr><th scope="row">' + esc(MATCH_PARAM_LABELS[k]) + "</th><td>" +
        (params[k] === null || params[k] === undefined ? '<span class="muted">（未填）</span>' : esc(params[k]) + (k === "loa" ? " m" : "")) +
        "</td></tr>"
      ).join("") + "</tbody></table>" +
      '<p class="muted">只用以上五項對照條文的適用條件。</p>' +
      '<div class="btn-row"><a class="btn btn-small" href="#spec/' + esc(s.pid) + '">看規格書</a>' +
      '<a class="btn btn-small" href="#requirement/' + esc(s.pid) + '">需求填寫</a>' +
      '<a class="btn btn-small" href="#rule-match">換專案</a></div></section>';

    const right = "<section>" +
      '<div class="card"><h3>符合條件、可能相關的條文（' + matched.length + " 筆）</h3>" + matchListHtml(matched, "match") + "</div>" +
      '<div class="card"><h3>需確認（' + confirm.length + " 筆）</h3>" +
        '<p class="muted">規格缺少這些條文需要的參數，所以不算符合。補齊後再對照一次。</p>' + matchListHtml(confirm, "confirm") + "</div>" +
      '<p class="muted">共比對 ' + esc(r.checked) + " 筆已發佈條文；條件不符合的條文不列出。</p></section>";

    document.getElementById("main").innerHTML =
      "<h2>法規對照：" + esc(r.project && r.project.name) + "</h2>" + ruleDisclaimer() + demoNotice() +
      '<div class="match-layout">' + left + right + "</div>";
  }

  // ======================================================================
  // 畫面 8：法規維護（只限 admin）：列表、新增／編輯、發佈、停用、修改紀錄
  // ======================================================================
  let raState = null;
  const RA_FILTERS = [["all", "全部"], ["draft", "草稿"], ["published", "已發佈"], ["disabled", "已停用"]];

  function renderRuleAdmin() {
    raState = {
      status: "all", rules: [], loading: true, loadError: "", message: "", kind: "", busy: false,
      form: null, revFor: null, revisions: null, revError: ""
    };
    drawRuleAdmin();
    raLoad();

  async function raLoad() {
    const s = raState;
    s.loading = true;
    drawRuleAdmin();
    try {
      const res = await call("GET", "/api/rules?status=" + encodeURIComponent(s.status));
      if (raState !== s) return;

  function missingLabels(r) {
    const miss = rulePublishMissing(r);
    return RULE_PUBLISH_REQUIRED.filter(f => miss[f.key]).map(f => f.label);
  }

  function raFormHtml(s) {
    const f = s.form;
    const d = f.data;
    const c = d.conditions || {};
    const e = f.errors;
    const err = k => '<p class="field-error" id="ra-' + k + '-err" role="alert">' + esc(e[k] || "") + "</p>";
    const cls = k => "field" + (e[k] ? " has-error" : "");
    const aria = k => ' aria-describedby="ra-' + k + '-err"' + (e[k] ? ' aria-invalid="true"' : "");
    const pubReq = k => RULE_PUBLISH_REQUIRED.some(x => x.key === k);
    const tag = (k, required) => required ? '<span class="req">必填</span>'
      : (pubReq(k) ? '<span class="req">發佈前必填</span>' : '<span class="opt">選填</span>');

    const text = (k, label, required, hint) =>
      '<div class="' + cls(k) + '"><label class="field-label" for="ra-' + k + '">' + esc(label) + tag(k, required) + "</label>" +
      (hint ? '<p class="hint">' + esc(hint) + "</p>" : "") +
      '<input type="text" id="ra-' + k + '" maxlength="' + maxLen(k) + '" value="' + esc(d[k] || "") + '"' + aria(k) + ">" + err(k) + "</div>";
    const num = (k, label) =>
      '<div class="' + cls(k) + '"><label class="field-label" for="ra-' + k + '">' + esc(label) + '<span class="opt">選填</span></label>' +
      '<p class="hint">' + esc("公尺，範圍 " + RULE_LOA_LIMIT_MIN + "–" + RULE_LOA_LIMIT_MAX + "（含等於）；空白代表不限") + "</p>" +
      '<input type="number" id="ra-' + k + '" inputmode="decimal" step="any" min="' + RULE_LOA_LIMIT_MIN + '" max="' + RULE_LOA_LIMIT_MAX + '" value="' +
      esc(c[k] === undefined || c[k] === null ? "" : c[k]) + '"' + aria(k) + ">" + err(k) + "</div>";
    const multi = L => {
      const opts = reqField(L.field).options;
      const sel = Array.isArray(c[L.key]) ? c[L.key] : [];
      return '<fieldset class="' + cls(L.key) + '"><legend>' + esc(L.label) + '<span class="opt">選填</span></legend>' +
        '<p class="hint">可複選；都不勾代表不限</p><div class="choices">' +
        opts.map(o => '<label class="choice"><input type="checkbox" name="ra-' + esc(L.key) + '" value="' + esc(o) + '"' +
          (sel.includes(o) ? " checked" : "") + "><span>" + esc(o) + "</span></label>").join("") +
        "</div>" + err(L.key) + "</fieldset>";

    const isNew = f.id === null;
    const note = isNew

      : (f.status === "published"
        ? "這筆條文已發佈：儲存後仍是「已發佈」，條文編號、規則版本、生效日期不能清空。"
        : "儲存後狀態不變（目前：" + (RULE_STATUS_NAMES[f.status] || f.status) + "）。");

    return '<div class="card" id="ra-form"><h3>' + (isNew ? "新增條文" : "編輯條文 #" + esc(f.id)) + "</h3>" +
      '<p class="muted">' + esc(note) + "</p>" +
      (e._form ? '<p class="error">' + esc(e._form) + "</p>" : "") +
      text("article_no", "條文編號", false, "示範資料請用 DEMO- 開頭，避免被誤認成真的 RINA 條文") +
      '<fieldset class="' + cls("category") + '"><legend>分類<span class="req">必填</span></legend><div class="choices">' +
        RULE_CATEGORIES.map(o => '<label class="choice"><input type="radio" name="ra-category" value="' + esc(o) + '"' +
          (d.category === o ? " checked" : "") + "><span>" + esc(o) + "</span></label>").join("") +
      "</div>" + err("category") + "</fieldset>" +
      text("title", "標題", true, "") +
      '<div class="' + cls("summary") + '"><label class="field-label" for="ra-summary">重點說明<span class="opt">選填</span></label>' +
        '<p class="hint">' + esc("船廠自行整理的重點摘要，不要貼 RINA 原文；最多 " + maxLen("summary") + " 字") + "</p>" +
        '<textarea id="ra-summary" maxlength="' + maxLen("summary") + '"' + aria("summary") + ">" + esc(d.summary || "") + "</textarea>" + err("summary") + "</div>" +
      text("rule_version", "規則版本", false, "例如 DEMO-2026") +
      '<div class="' + cls("effective_date") + '"><label class="field-label" for="ra-effective_date">生效日期' + tag("effective_date", false) + "</label>" +
        '<input type="date" id="ra-effective_date" value="' + esc(d.effective_date || "") + '"' + aria("effective_date") + ">" + err("effective_date") + "</div>" +
      "<h3>適用條件</h3>" + (e.conditions ? '<p class="error">' + esc(e.conditions) + "</p>" : "") +

      RULE_COND_LISTS.map(multi).join("") +
      '<div class="btn-row"><button type="button" class="btn btn-primary" data-action="ra-save"' + (s.busy ? " disabled" : "") + ">" +
        (isNew ? "儲存為草稿" : "儲存") + "</button>" +
      '<button type="button" class="btn" data-action="ra-cancel"' + (s.busy ? " disabled" : "") + ">取消</button></div></div>";
  }

  function raRevsHtml(s) {
    if (s.revFor === null) return "";
    const r = s.rules.find(x => x.id === s.revFor);
    let body;
    if (s.revError) body = '<p class="error">' + esc(s.revError) + "</p>";
    else if (!s.revisions) body = '<p class="muted">讀取中…</p>';
    else if (!s.revisions.length) body = '<p class="muted">沒有修改紀錄。</p>';
    else body = '<ul class="side-list">' + s.revisions.map(v =>
      "<li><strong>#" + esc(v.revision) + " " + esc(RULE_ACTION_NAMES[v.action] || v.action) + "</strong>" +
      '<div class="meta">修改人：' + esc(v.changed_by_name ? v.changed_by_name + "（" + v.changed_by + "）" : v.changed_by) +
      " · 時間：" + esc(fmtTime(v.changed_at)) + "</div>" +
      "<details><summary>看當時的完整內容</summary>" + ruleDetailHtml(v.snapshot || {}, true) + "</details></li>"
    ).join("") + "</ul>";
    return '<div class="card" id="ra-revs"><h3>修改紀錄：' + esc(r ? (r.article_no || r.title) : "#" + s.revFor) + "</h3>" +
      '<p class="muted">每次新增、編輯、發佈、停用都會留下一筆，不會被覆蓋。</p>' + body +
      '<div class="btn-row"><button type="button" class="btn btn-small" data-action="ra-revs-close">關閉修改紀錄</button></div></div>';
  }

  function drawRuleAdmin() {
    const s = raState;
    const msg = s.message ? '<div class="notice ' + esc(s.kind) + '" role="status">' + esc(s.message) + "</div>" : "";
    const filters = '<div class="chips" role="group" aria-label="狀態篩選">' +
      RA_FILTERS.map(([v, label]) =>
        '<button type="button" class="chip" data-action="ra-filter" data-status="' + esc(v) + '" aria-pressed="' + (s.status === v ? "true" : "false") + '">' + esc(label) + "</button>"
      ).join("") + "</div>";

    let list;
    if (s.loading) list = '<p class="muted">讀取中…</p>';
    else if (s.loadError) list = '<p class="error">' + esc(s.loadError) + "</p>";
    else if (!s.rules.length) list = '<p class="muted">這個狀態下沒有條文。</p>';
    else list = "<table><thead><tr><th>條文編號</th><th>分類</th><th>標題</th><th>狀態</th><th>規則版本</th><th>生效日期</th><th>最後修改</th><th>操作</th></tr></thead><tbody>" +
      s.rules.map(r => {
        const miss = missingLabels(r);
        const dis = s.busy ? " disabled" : "";
        const pub = r.status === "published" ? "" :
          '<button type="button" class="btn btn-small" data-action="ra-publish" data-id="' + esc(r.id) + '"' +
          (miss.length ? ' disabled aria-describedby="ra-miss-' + esc(r.id) + '"' : dis) + ">" + (r.status === "disabled" ? "重新發佈" : "發佈") + "</button>" +
          (miss.length ? '<span class="pub-reason" id="ra-miss-' + esc(r.id) + '">缺' + esc(miss.join("、")) + "，不能發佈</span>" : "");
        const off = r.status === "disabled" ? "" :
          '<button type="button" class="btn btn-small" data-action="ra-disable" data-id="' + esc(r.id) + '"' + dis + ">停用</button>";
        return "<tr><td>" + orBlank(r.article_no) + "</td><td>" + esc(r.category) + "</td><td>" + esc(r.title) + "</td>" +
          "<td>" + statusBadge(r.status) + "</td><td>" + orBlank(r.rule_version) + "</td><td>" + orBlank(r.effective_date) + "</td>" +
          '<td class="meta">' + esc(r.updated_by_name || r.updated_by) + "<br>" + esc(fmtTime(r.updated_at)) + "</td>" +
          '<td><div class="rule-actions">' +
            '<button type="button" class="btn btn-small" data-action="ra-edit" data-id="' + esc(r.id) + '"' + dis + ">編輯</button>" +
            pub + off +
            '<button type="button" class="btn btn-small" data-action="ra-revs" data-id="' + esc(r.id) + '">修改紀錄</button>' +
          "</div></td></tr>";
      }).join("") + "</tbody></table>";

    document.getElementById("main").innerHTML =
      "<h2>法規維護</h2>" + ruleDisclaimer() + demoNotice() + msg +
      (s.form ? raFormHtml(s) : "") +
      raRevsHtml(s) +
      '<div class="card"><div class="btn-row"><h3 style="margin:0">條文列表</h3><span class="spacer"></span>' +
        '<button type="button" class="btn btn-primary" data-action="ra-new"' + (s.busy ? " disabled" : "") + ">新增條文</button></div>" +
        filters + '<div style="margin-top:12px">' + list + "</div></div>";
  }

  function raCollect() {
    const s = raState;
    const f = s && s.form;
    const box = document.getElementById("ra-form");
    if (!f || !box) return;
    const val = id => { const el = document.getElementById(id); return el ? el.value : ""; };
    const cat = box.querySelector('input[name="ra-category"]:checked');
    f.bad = new Set();
    const conditions = {};
    ["loa_min", "loa_max"].forEach(k => {
      const el = document.getElementById("ra-" + k);
      if (!el) return;
      if (el.validity && el.validity.badInput) f.bad.add(k);
      else if (el.value.trim() !== "") conditions[k] = el.value.trim();
    });
    RULE_COND_LISTS.forEach(L => {
      conditions[L.key] = Array.from(box.querySelectorAll('input[name="ra-' + L.key + '"]:checked')).map(el => el.value);
    });
    f.data = {
      article_no: val("ra-article_no"), category: cat ? cat.value : "", title: val("ra-title"),
      summary: val("ra-summary"), rule_version: val("ra-rule_version"), effective_date: val("ra-effective_date"),
      conditions
    };
  }

  // 和後端 createRule／updateRule 同一套檢查
  function raValidate() {
    const f = raState.form;
    const v = validateRule(f.data);
    f.bad.forEach(k => { v.errors[k] = (k === "loa_min" ? "「船長下限」" : "「船長上限」") + "必須是數字。"; });
    if (f.status === "published" && !v.errors._form) {
      const miss = rulePublishMissing(v.data);
      Object.keys(miss).forEach(k => { if (!v.errors[k]) v.errors[k] = "已發佈的條文不能清空這一項。"; });
    }
    return v;
  }

  async function raAfterWrite(ruleId) {
    const s = raState;
    await raLoad();
    if (raState === s && s.revFor === ruleId) await raLoadRevs(ruleId);
  }

  async function raSave() {
    const s = raState;
    raCollect();
    const f = s.form;
    const v = raValidate();
    f.errors = v.errors;
    if (Object.keys(v.errors).length) {
      s.message = "還有 " + Object.keys(v.errors).length + " 個欄位沒填或不正確。";
      s.kind = "err";
      drawRuleAdmin();
      const first = document.querySelector("#ra-form .has-error input, #ra-form .has-error textarea");
      if (first) first.focus();
      return;
    }
    s.busy = true;
    drawRuleAdmin();
    try {
      const res = f.id === null
        ? await call("POST", "/api/rules", { data: v.data })
        : await call("PUT", "/api/rules/" + f.id, { data: v.data });
      if (raState !== s) return;
      const rule = res.rule || {};
      s.form = null;
      s.busy = false;
      s.message = (f.id === null ? "已新增條文（草稿）：" : "已儲存條文：") + (rule.article_no || rule.title || "") + "。" +
        (demoMode ? "（示範模式：只存在記憶體）" : "");
      s.kind = "ok";
      await raAfterWrite(rule.id);
    } catch (e) {
      if (raState !== s) return;
      s.busy = false;
      f.errors = e.fields || {};
      s.message = e.message;
      s.kind = "err";
      drawRuleAdmin();
    }
  }

  async function raChangeStatus(id, action) {
    const s = raState;
    const r = s.rules.find(x => x.id === id);
    const name = r ? (r.article_no || r.title) : "#" + id;
    const verb = action === "publish" ? "發佈" : "停用";
    const extra = action === "publish"
      ? "\n發佈後船廠人員就能在法規查詢、法規對照看到。"
      : "\n停用後法規查詢、法規對照都不會出現；不會刪除，之後可以重新發佈。";
    if (!window.confirm("要" + verb + "「" + name + "」嗎？" + extra)) return;
    s.busy = true;
    drawRuleAdmin();
    try {
      await call("POST", "/api/rules/" + id + "/" + action, {});
      if (raState !== s) return;
      s.message = "已" + verb + "：" + name + "。" + (demoMode ? "（示範模式：只存在記憶體）" : "");
      s.kind = "ok";
    } catch (e) {
      if (raState !== s) return;
      const detail = e.fields ? " " + Object.keys(e.fields).map(k => e.fields[k]).join(" ") : "";
      s.message = e.message + detail;
      s.kind = "err";
    }
    s.busy = false;
    await raAfterWrite(id);
  }

  async function raLoadRevs(id) {
    const s = raState;
    s.revFor = id;
    s.revisions = null;
    s.revError = "";
    drawRuleAdmin();
    try {
      const res = await call("GET", "/api/rules/" + id + "/revisions");
      if (raState !== s || s.revFor !== id) return;
      s.revisions = res.revisions || [];
    } catch (e) {
      if (raState !== s || s.revFor !== id) return;
      s.revError = e.message;
    }
    drawRuleAdmin();
  }

  function raScrollTo(elId) {
    const el = document.getElementById(elId);
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "start" });
  }

  function onRuleAdminClick(action, btn) {
    const s = raState;
    if (!s || s.busy) return;
    const id = Number(btn.getAttribute("data-id"));
    // 表單開著時，先把畫面上打的字收進狀態，重畫才不會不見
    if (s.form && action !== "ra-new" && action !== "ra-edit" && action !== "ra-cancel") raCollect();

    if (action === "ra-filter") {
      const st = btn.getAttribute("data-status");
      s.status = RA_FILTERS.some(x => x[0] === st) ? st : "all";
      raLoad();
    } else if (action === "ra-new") {
      s.form = {
        id: null, status: "draft", errors: {}, bad: new Set(),
        data: { article_no: "", category: "", title: "", summary: "", rule_version: "", effective_date: "", conditions: {} }
      };
      s.message = "";
      drawRuleAdmin();
      raScrollTo("ra-form");
    } else if (action === "ra-edit") {
      const r = s.rules.find(x => x.id === id);
      if (!r) return;
      s.form = {
        id: r.id, status: r.status, errors: {}, bad: new Set(),
        data: {
          article_no: r.article_no, category: r.category, title: r.title, summary: r.summary,
          rule_version: r.rule_version, effective_date: r.effective_date, conditions: clone(r.conditions) || {}
        }
      };
      s.message = "";
      drawRuleAdmin();
      raScrollTo("ra-form");
    } else if (action === "ra-cancel") {
      s.form = null;
      s.message = "";
      drawRuleAdmin();
    } else if (action === "ra-save") {
      raSave();
    } else if (action === "ra-publish") {
      raChangeStatus(id, "publish");
    } else if (action === "ra-disable") {
      raChangeStatus(id, "disable");
    } else if (action === "ra-revs") {
      raLoadRevs(id).then(() => raScrollTo("ra-revs"));
    } else if (action === "ra-revs-close") {
      s.revFor = null;
      s.revisions = null;
      drawRuleAdmin();
    }
  }

  // ---- 畫面上的按鈕與輸入：用一個監聽器統一處理（畫面重畫也不用重新綁） ----
  document.getElementById("main").addEventListener("click", (ev) => {
    const btn = ev.target.closest("[data-action]");
    if (!btn || btn.disabled) return;
    const action = btn.getAttribute("data-action");
    if (action.startsWith("req-")) onRequirementClick(action, btn);
    else if (action.startsWith("rs-")) onRuleSearchClick(action, btn);
    else if (action.startsWith("ra-")) onRuleAdminClick(action, btn);
    else onSpecClick(action, btn);
  });

  // 法規查詢的搜尋列：按 Enter 或「搜尋」都走這裡（不讓瀏覽器真的送出表單）
  document.getElementById("main").addEventListener("submit", (ev) => {
    ev.preventDefault();
    if (ev.target.getAttribute("data-form") === "rs-search" && rsState) {
      rsReadQuery();
      rsLoad();
    }
  });

  // 打字／選擇後，立刻提示該欄位的格式與範圍
  document.getElementById("main").addEventListener("change", (ev) => {
    const key = ev.target.getAttribute && ev.target.getAttribute("data-key");
    if (!key || !FIELD_BY_KEY[key]) return;
    if (reqState && document.getElementById("req-form") && document.getElementById("req-form").contains(ev.target)) {
      collectFields(document.getElementById("req-form"), [FIELD_BY_KEY[key]], "rq-", reqState.data, reqState.bad);
      const msg = liveCheck("rq-", reqState.data, reqState.bad, key);
      if (msg) reqState.errors[key] = msg; else delete reqState.errors[key];
    } else if (specState && specState.editing && document.getElementById("spec-edit") && document.getElementById("spec-edit").contains(ev.target)) {
      collectFields(document.getElementById("spec-edit"), [FIELD_BY_KEY[key]], "ed-", specState.editData, specState.editBad);
      const msg = liveCheck("ed-", specState.editData, specState.editBad, key);
      if (msg) specState.editErrors[key] = msg; else delete specState.editErrors[key];
    }
  });

  function renderTodo(main, page) {
    main.innerHTML = "<h2>" + esc(page.title) + '</h2><div class="card"><p class="todo">下一步會做</p></div>';
  }

  function route() {
    routeSeq++;
    reqState = null;
    specState = null;
    rsState = null;
    rmState = null;
    raState = null;
    const main = document.getElementById("main");
    const pages = visiblePages();
    const hash = (location.hash || "#projects").slice(1);
    const parts = hash.split("/");
    const id = parts[0];
    let param = parts[1] || "";
    if (param && !/^\d{1,12}$/.test(param)) param = "";
    let page = pages.find(p => p.id === id);
    if (!page) {
      // 沒有權限或不存在的頁面：回到專案列表
      page = pages[0];
      param = "";
      if (location.hash && location.hash !== "#" + page.id) {
        history.replaceState(null, "", "#" + page.id);
      }
    }
    renderNav(page.id);
    if (page.id === "projects") renderProjects(main);
    else if (page.id === "requirement") renderRequirement(main, param);
    else if (page.id === "spec") renderSpec(main, param);
    else if (page.id === "rule-search") renderRuleSearch();
    else if (page.id === "rule-match") renderRuleMatch(main, param);
    else if (page.id === "rule-admin") renderRuleAdmin();
    else renderTodo(main, page);
  }

  function showWho() {
    const who = document.getElementById("who");
    who.innerHTML = (demoMode ? "示範身分：" : "目前登入：") + esc(me.name || me.email) +
      '（' + esc(me.email) + '）<span class="role">' + esc(ROLE_NAMES[me.role] || me.role) + "</span>";
  }

  // 進入示範模式：只用上面的假資料，不送任何請求
  function enterDemo(reason) {
    demoMode = true;
    document.getElementById("dev-bar").style.display = "none";
    document.getElementById("demo-bar").style.display = "block";
    document.getElementById("demo-note").textContent = reason + "（需求、規格書、意見、法規條文的修改都只放在記憶體，重新整理就消失。）";
    const sel = document.getElementById("demo-role");
    sel.value = DEMO_USERS[0].email;
    me = DEMO_USERS[0];
    sel.addEventListener("change", () => {
      me = DEMO_USERS.find(u => u.email === sel.value) || DEMO_USERS[0];
      showWho();
      route();
    });
    showWho();
    window.addEventListener("hashchange", route);
    route();
  }

  // 這個頁面是不是「不在正式網站上」：是的話，/api/me 失敗時才可以自動進示範模式
  function canAutoDemo() {
    if (location.protocol !== "http:" && location.protocol !== "https:") return true;
    if (!location.hostname) return true;
    let inIframe = false;
    try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
    return inIframe;
  }

  async function start() {
    const who = document.getElementById("who");
    const main = document.getElementById("main");
    if (wantDemo) {
      enterDemo("網址帶了 ?demo=1。拿掉它並重新整理，就會改用正式資料。");
      return;
    }
    try {
      me = await api("/api/me");
      showWho();
      window.addEventListener("hashchange", route);
      route();
    } catch (e) {
      // 只有「不是正式網站」的情況才自動進示範模式：
      // 不是 http(s) 提供的頁面（例如 file:）、hostname 是空的、或頁面在 iframe 裡（例如成品頁預覽）。
      if (canAutoDemo()) {
        enterDemo("連不到後端，所以先顯示示範畫面。若你是正式使用者，請重新整理頁面或重新登入。");
        return;
      }
      who.textContent = "尚未登入";
      if (e.noBackend) {
        main.innerHTML = '<div class="card"><p class="error">' +
          esc("連不到伺服器或登入已過期，請重新整理或重新登入") + "</p></div>";
        return;
      }
      const hint = e.status === 403
        ? "請用船廠核發的帳號透過 Cloudflare Access 登入；若已登入仍看到這段，代表帳號還沒開通，請聯絡船廠管理者。"
        : "連不到後端。這個畫面需要搭配 Worker 後端一起執行（見 docs/dev.md）。";
      main.innerHTML = '<div class="card"><p class="error">' + esc(e.message) + '</p><p>' + esc(hint) + "</p></div>";
    }
  }

  start();
</script>
</body>
</html>
